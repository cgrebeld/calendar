name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: app
      - run: python3 -m unittest discover -s deploy -p '*_test.py'
      - run: bash -n deploy/install.sh
  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Release identity
        id: identity
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          version=dev
          if [[ "$REF" == refs/tags/* ]]; then
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use a stable vX.Y.Z tag'; exit 1; }
            version=${TAG#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          load: true
          tags: calendar-api:ci
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            APP_REVISION=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: release-web
          platforms: linux/amd64
          load: true
          tags: calendar-web:ci
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            APP_REVISION=${{ github.sha }}
            VITE_API_URL=
            VITE_SKIN=woodland
      - name: Debian 13 Wayland kiosk smoke test
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          docker build -t calendar-kiosk:ci .github/kiosk
          docker network create calendar-kiosk-ci
          trap 'docker logs calendar-kiosk-api; docker logs calendar-kiosk-web; docker rm -f calendar-kiosk-api calendar-kiosk-web; docker network rm calendar-kiosk-ci' EXIT
          docker run -d --name calendar-kiosk-api --network calendar-kiosk-ci --network-alias calendar-api calendar-api:ci
          docker run -d --name calendar-kiosk-web --network calendar-kiosk-ci --network-alias calendar-web calendar-web:ci
          docker run --rm --network calendar-kiosk-ci --shm-size=512m -e VERSION calendar-kiosk:ci
      - name: Smoke test and publish tested images
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 deploy/publish.py
