server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $calendar_api calendar-api:3000;
    proxy_pass http://$calendar_api$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # Vite content-hashes these filenames, so a URL never changes content.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
